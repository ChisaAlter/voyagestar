# =============================================================================
# Voyagestar — Docker Compose
#
# 用法（在仓库根目录执行）:
#   docker compose -f docker/docker-compose.yml up -d
#   VOYAGESTAR_PORT=9090 docker compose -f docker/docker-compose.yml up -d
#   VOYAGESTAR_DEFAULT_PASSWORD=<your-strong-password> docker compose -f docker/docker-compose.yml up -d
#
# 可在 docker/ 目录放置 .env 文件，例如:
#   VOYAGESTAR_PORT=9090
#   VOYAGESTAR_DEFAULT_PASSWORD=<your-strong-password>
#   VOYAGESTAR_ADMIN_USERNAME=admin
#   VOYAGESTAR_DATABASE_DRIVER=postgresql
#   VOYAGESTAR_DATABASE_URL=postgresql://voyagestar:voyagestar@host.docker.internal:5432/voyagestar
#
# 注意: docker/.env 仅用于 Compose 插值；变量必须列在下方 environment
# 才会进入容器。也可写入数据卷内的 ~/.voyagestar/env（宿主机挂载目录下的 env）。
# 密码须 ≥8 位且同时包含字母与数字（与控制台改密策略一致）。
# 后续计划：首次启动可改为随机生成密码并写入 credential.txt。
# =============================================================================

services:
  voyagestar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: voyagestar:latest
    container_name: voyagestar
    restart: unless-stopped
    ports:
      - "${VOYAGESTAR_PORT:-8088}:${VOYAGESTAR_PORT:-8088}"
    volumes:
      - ${VOYAGESTAR_DATA:-~/.voyagestar}:/data/.voyagestar
    environment:
      - HOME=/data
      - VOYAGESTAR_BIND_HOST=0.0.0.0
      - VOYAGESTAR_PORT=${VOYAGESTAR_PORT:-8088}
      - VOYAGESTAR_LOG_LEVEL=${VOYAGESTAR_LOG_LEVEL:-info}
      - VOYAGESTAR_DEFAULT_PASSWORD=${VOYAGESTAR_DEFAULT_PASSWORD:-}
      - VOYAGESTAR_ADMIN_USERNAME=${VOYAGESTAR_ADMIN_USERNAME:-admin}
      - VOYAGESTAR_ADMIN_DISPLAY_NAME=${VOYAGESTAR_ADMIN_DISPLAY_NAME:-Admin}
      - VOYAGESTAR_DATABASE_URL=${VOYAGESTAR_DATABASE_URL:-}
      - VOYAGESTAR_DATABASE_DRIVER=${VOYAGESTAR_DATABASE_DRIVER:-}
      - VOYAGESTAR_DATABASE_SQLITE_PATH=${VOYAGESTAR_DATABASE_SQLITE_PATH:-}
      - VOYAGESTAR_DATABASE_HOST=${VOYAGESTAR_DATABASE_HOST:-}
      - VOYAGESTAR_DATABASE_PORT=${VOYAGESTAR_DATABASE_PORT:-}
      - VOYAGESTAR_DATABASE_NAME=${VOYAGESTAR_DATABASE_NAME:-}
      - VOYAGESTAR_DATABASE_USER=${VOYAGESTAR_DATABASE_USER:-}
      - VOYAGESTAR_DATABASE_PASSWORD=${VOYAGESTAR_DATABASE_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - VOYAGESTAR_LANGFUSE_ENABLED=${VOYAGESTAR_LANGFUSE_ENABLED:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
