# =============================================================================
# Voyagestar — Remote Phone (mobile) compose overlay for local / DinD testing
#
# Usage (from repo root):
#   # once: download platform-tools next to the repo
#   mkdir -p .tools && cd /tmp && curl -fsSL -o pt.zip \
#     https://dl.google.com/android/repository/platform-tools-latest-linux.zip \
#     && unzip -qo pt.zip -d /workspace/Voyagestar/.tools
#
#   docker compose -f docker/docker-compose.mobile.yml up -d --build
#
# This file is standalone (not an overlay) because ``network_mode: host``
# conflicts with published ``ports`` from the base compose file.
#
# Host prerequisites:
# - Docker socket usable by the container
# - /dev/binder or /dev/binderfs on the host
# - Enough free disk for the Redroid image
# =============================================================================

services:
  voyagestar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: voyagestar:latest
    container_name: voyagestar
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - ${VOYAGESTAR_DATA:-~/.voyagestar}:/data/.voyagestar
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/binderfs:/dev/binderfs
      - ${VOYAGESTAR_PLATFORM_TOOLS:-../.tools/platform-tools}:/opt/android-sdk/platform-tools:ro
    environment:
      - HOME=/data
      - VOYAGESTAR_BIND_HOST=0.0.0.0
      - VOYAGESTAR_PORT=${VOYAGESTAR_PORT:-8088}
      - VOYAGESTAR_LOG_LEVEL=${VOYAGESTAR_LOG_LEVEL:-info}
      - VOYAGESTAR_DEFAULT_PASSWORD=${VOYAGESTAR_DEFAULT_PASSWORD:-}
      - VOYAGESTAR_ADMIN_USERNAME=${VOYAGESTAR_ADMIN_USERNAME:-admin}
      - VOYAGESTAR_MOBILE_ADB_HOST=${VOYAGESTAR_MOBILE_ADB_HOST:-127.0.0.1:5555}
      - VOYAGESTAR_MOBILE_CONTAINER=${VOYAGESTAR_MOBILE_CONTAINER:-voyagestar-mobile-android}
      - VOYAGESTAR_ENABLE_MOBILE=${VOYAGESTAR_ENABLE_MOBILE:-1}
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
