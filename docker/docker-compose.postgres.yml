# =============================================================================
# Local PostgreSQL (+ pgvector) for Voyagestar dual-backend development / tests
#
# From repo root:
#   docker compose -f docker/docker-compose.postgres.yml up -d
#   docker compose -f docker/docker-compose.postgres.yml down
#
# Connection (default):
#   postgresql://voyagestar:voyagestar@127.0.0.1:5432/voyagestar
#
# For pytest / Voyagestar:
#   export VOYAGESTAR_TEST_DATABASE_URL='postgresql://voyagestar:voyagestar@127.0.0.1:5432/voyagestar'
#   export VOYAGESTAR_DATABASE_URL='postgresql://voyagestar:voyagestar@127.0.0.1:5432/voyagestar'
#
# Init layers (ADR 002):
#   - Control-plane schema → Voyagestar migrate (NNN_*.pg.sql), not this compose
#   - CREATE EXTENSION vector → postgres/init-vector.sql (initdb.d only)
#   - Agent memory tables → harness-memory at runtime
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voyagestar-postgres
    restart: unless-stopped
    ports:
      - "${VOYAGESTAR_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${VOYAGESTAR_PG_USER:-voyagestar}
      POSTGRES_PASSWORD: ${VOYAGESTAR_PG_PASSWORD:-voyagestar}
      POSTGRES_DB: ${VOYAGESTAR_PG_DB:-voyagestar}
    volumes:
      - voyagestar_pgdata:/var/lib/postgresql/data
      - ./postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voyagestar_pgdata:
