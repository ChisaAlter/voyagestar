services:
  voyagestar:
    image: ghcr.io/chisaalter/voyagestar:latest
    container_name: voyagestar
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8088:8088"
    volumes:
      - "/var/apps/voyagestar/share/voyagestar/data:/data/.voyagestar"
    environment:
      - HOME=/data
      - VOYAGESTAR_BIND_HOST=0.0.0.0
      - VOYAGESTAR_PORT=${VOYAGESTAR_PORT:-8088}
      - VOYAGESTAR_LOG_LEVEL=${VOYAGESTAR_LOG_LEVEL:-info}
      - VOYAGESTAR_DEFAULT_PASSWORD=${VOYAGESTAR_DEFAULT_PASSWORD:-}
      - VOYAGESTAR_ADMIN_USERNAME=${VOYAGESTAR_ADMIN_USERNAME:-admin}
      - VOYAGESTAR_ADMIN_DISPLAY_NAME=${VOYAGESTAR_ADMIN_DISPLAY_NAME:-Admin}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
