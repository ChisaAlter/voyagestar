<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voyagestar Sanctum</title>
    <link rel="stylesheet" href="/shell.css" />
  </head>
  <body>
    <div class="window-chrome voyagestar-desktop-drag"></div>

    <main class="loading" id="loading-panel">
      <div class="loading-card">
        <img
          src="/voyagestar-badge.svg"
          alt="Voyagestar"
          draggable="false"
        />
        <p class="loading-brand" id="brand">Voyagestar Sanctum</p>
        <ol class="loading-steps" id="steps">
          <li data-phase="checking"><i class="dot"></i><span data-t="stepChecking"></span></li>
          <li data-phase="preparing"><i class="dot"></i><span data-t="stepPreparing"></span></li>
          <li data-phase="starting"><i class="dot"></i><span data-t="stepStarting"></span></li>
        </ol>
        <div class="loading-footer">
          <div class="loading-bar" role="progressbar" aria-hidden="true">
            <span class="loading-bar-fill"></span>
          </div>
          <p class="loading-status" id="status"></p>
        </div>
        <div class="error hidden" id="error">
          <div class="error-badge" aria-hidden="true">!</div>
          <p class="error-text" id="error-text"></p>
          <div class="error-actions">
            <button type="button" class="primary" id="retry"></button>
            <button type="button" class="ghost" id="open-data"></button>
            <button type="button" class="ghost" id="quit"></button>
          </div>
        </div>
      </div>
    </main>

    <script type="module">
      import {
        applyControlsCopy,
        call,
        installWindowControls,
        t,
      } from "/shell.js";
      import { Events } from "/wails/runtime.js";

      const PHASES = ["checking", "preparing", "starting"];
      const panel = document.getElementById("loading-panel");
      const statusEl = document.getElementById("status");
      const errorBox = document.getElementById("error");
      const errorText = document.getElementById("error-text");
      const stepEls = [...document.querySelectorAll("#steps li")];

      function applyLocale(locale) {
        document.getElementById("brand").textContent = t(locale, "brand");
        for (const el of document.querySelectorAll("[data-t]")) {
          el.textContent = t(locale, el.dataset.t);
        }
        document.getElementById("retry").textContent = t(locale, "retry");
        document.getElementById("open-data").textContent =
          t(locale, "openDataDir");
        document.getElementById("quit").textContent = t(locale, "quit");
        applyControlsCopy(locale);
      }

      function setPhase(phase) {
        const idx = PHASES.indexOf(phase);
        const active = phase === "ready" ? PHASES.length : idx;
        stepEls.forEach((li, i) => {
          li.classList.toggle("is-done", i < active);
          li.classList.toggle("is-active", i === active);
        });
      }

      function showError(message) {
        panel.classList.add("is-error");
        errorText.textContent = message;
        errorBox.classList.remove("hidden");
      }

      function clearError() {
        panel.classList.remove("is-error");
        errorBox.classList.add("hidden");
      }

      let locale = "en";
      try {
        const s = await call("GetSettingsStatus");
        locale = s.locale || "en";
      } catch {
        // bridge not ready yet — boot events carry their own localized text
      }
      installWindowControls();
      applyLocale(locale);
      statusEl.textContent = t(locale, "statusWait");

      document
        .getElementById("retry")
        .addEventListener("click", () => call("Restart"));
      document
        .getElementById("open-data")
        .addEventListener("click", () => call("OpenDataDir"));
      document
        .getElementById("quit")
        .addEventListener("click", () => call("Quit"));

      function handleBoot(phase, message) {
        if (phase === "error") {
          showError(message);
          return;
        }
        if (!phase) return;
        clearError();
        if (message) statusEl.textContent = message;
        setPhase(phase);
      }

      Events.On("desktop:boot", (ev) => {
        const data = ev?.data ?? ev ?? {};
        const phase = typeof data === "object" ? data.phase : "";
        const message =
          typeof data === "string" ? data : String(data?.message ?? "");
        handleBoot(phase, message);
      });

      // Catch up on phases emitted before the listener registered.
      try {
        const state = await call("GetBootState");
        handleBoot(state?.phase, state?.message);
      } catch {
        // bridge not ready — live events will still arrive
      }
    </script>
  </body>
</html>
